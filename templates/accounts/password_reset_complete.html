{% extends 'accounts/auth_layout.html' %}

{% block title %}Password Reset Complete | QuickBite{% endblock %}

{% block auth_content %}
    <div style="text-align:center;">
        <div style="width:80px;height:80px;border-radius:50%;background:#e8f5e9;color:#2e7d32;display:inline-flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;">
            <i class='bx bx-check-shield'></i>
        </div>
        <h1>Password reset! 🎉</h1>
        <p class="qb-auth-sub">
            Your password has been set successfully. You can now sign in with your new password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary qb-btn-block">
            Sign In Now <i class='bx bxs-right-arrow-alt'></i>
        </a>
    </div>
{% endblock %}
