{% extends 'base.html' %}

{% block title %}Your Cart | QuickBite{% endblock %}

{% block content %}
    <div class="qb-page">
        <div class="container">

            <!-- Breadcrumb -->
            <nav class="qb-breadcrumb" aria-label="Breadcrumb">
                <a href="{% url 'core:home' %}"><i class='bx bx-home'></i> Home</a>
                <i class='bx bx-chevron-right'></i>
                <span class="current">Cart</span>
            </nav>

            <div class="section-header" data-aos="fade-up" style="text-align:left;align-items:flex-start;">
                <span class="section-tag">🛒 Review your order</span>
                <h2>Your <span class="gradient-text">Cart</span></h2>
            </div>

            <div class="qb-cart-layout">
                <!-- Item lines (AJAX-updated) -->
                <main>
                    {% include 'cart/includes/lines.html' %}
                </main>

                <!-- Sticky summary (AJAX-updated) -->
                <aside class="qb-summary-wrap">
                    {% include 'cart/includes/summary.html' %}
                </aside>
            </div>
        </div>
    </div>
{% endblock %}
