# Render Blueprint — https://render.com/docs/blueprint-spec
# Push the repo to GitHub, then "New +" → "Blueprint" in Render and pick it.
databases:
  - name: quickbite-db
    databaseName: quickbite
    user: quickbite
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: quickbite
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn quickbite.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /
    envVars:
      - key: QUICKBITE_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false          # set to <your-app>.onrender.com after first deploy
      - key: SITE_URL
        sync: false          # https://<your-app>.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: quickbite-db
          property: connectionString
      - key: USE_X_FORWARDED_HOST
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: PYTHON_VERSION
        value: "3.13.1"
